<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoxGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── Header bar ─────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <svg class="logo-icon" viewBox="0 0 18 18" fill="none">
        <path d="M9 2a7 7 0 1 1 0 14A7 7 0 0 1 9 2Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6 9c0-1.66 1.34-3 3-3v6a3 3 0 0 1-3-3Z" fill="currentColor"/>
      </svg>
      <span class="logo-text">VoxGuard</span>
    </div>
    <div class="topbar-center">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-label" id="statusLabel">Idle</span>
    </div>
    <div class="topbar-right">
      <span class="toggle-label">Enable</span>
      <label class="toggle-wrap">
        <input type="checkbox" id="masterEnable" checked>
        <span class="toggle-track"></span>
      </label>
    </div>
  </header>

  <!-- ── Main: meter hero + stats ───────────────── -->
  <main class="main">

    <section class="meter-section">
      <!-- Scale ticks left of bar -->
      <div class="meter-scale">
        <span>0</span>
        <span>-6</span>
        <span>-12</span>
        <span>-18</span>
        <span>-24</span>
        <span>-30</span>
        <span>-48</span>
        <span>-60</span>
      </div>

      <!-- The bar itself -->
      <div class="meter-bar-wrap">
        <div class="meter-bar" id="meterBar"></div>
        <div class="meter-peak" id="meterPeak"></div>
      </div>
    </section>

    <section class="readout-section">
      <div class="readout">
        <div class="readout-value" id="readoutValue">– –</div>
        <div class="readout-unit">dBFS</div>
      </div>

      <div class="zone-legend">
        <div class="zone-item green"><span class="zone-bar"></span>Normal  <span class="zone-range">below −12</span></div>
        <div class="zone-item yellow"><span class="zone-bar"></span>Elevated <span class="zone-range">−12 to −6</span></div>
        <div class="zone-item red"><span class="zone-bar"></span>Too Loud <span class="zone-range">above −6</span></div>
      </div>

      <div class="session-stats">
        <div class="stat">
          <div class="stat-value" id="statBreaches">0</div>
          <div class="stat-label">Breaches</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statScore">—</div>
          <div class="stat-label">Score</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statTime">0:00</div>
          <div class="stat-label">Session</div>
        </div>
      </div>
    </section>

  </main>

  <!-- ── Settings strip ─────────────────────────── -->
  <footer class="settings">

    <div class="setting-group">
      <div class="setting-label">
        <svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="4" r="2" stroke="currentColor" stroke-width="1.2"/><path d="M2 12c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Input Device
      </div>
      <div class="setting-control">
        <select id="deviceSelect" class="select">
          <option value="-1">Default Microphone</option>
        </select>
        <button class="btn-primary" id="startBtn">Start</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">
        <svg viewBox="0 0 14 14" fill="none"><path d="M7 2v10M4 5l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Sidetone
        <label class="toggle-wrap sm">
          <input type="checkbox" id="sidetoneEnable">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="setting-control">
        <input type="range" id="sidetoneLevel" min="0" max="100" value="40" class="slider">
        <span class="slider-val" id="sidetoneLevelVal">40%</span>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">
        <svg viewBox="0 0 14 14" fill="none"><path d="M2 4h10M2 7h7M2 10h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Duck Game
        <label class="toggle-wrap sm">
          <input type="checkbox" id="duckEnable" checked>
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="setting-control">
        <input type="range" id="duckAmount" min="0" max="80" value="25" class="slider">
        <span class="slider-val" id="duckAmountVal">25%</span>
      </div>
    </div>

    <div class="setting-group setting-group--narrow">
      <div class="setting-label">
        <svg viewBox="0 0 14 14" fill="none"><path d="M7 2a5 5 0 1 0 0 10A5 5 0 0 0 7 2ZM7 5v2l1.5 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Calibrate
      </div>
      <div class="setting-control">
        <button class="btn-secondary" id="calibrateBtn">Calibrate Voice</button>
      </div>
    </div>

  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
